name: Release

on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      os:
        type: string
        required: true
      target:
        type: string
        required: true
      nixpkgs:
        type: string
        default: master
      nix-info:
        type: boolean
        default: false
      share:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
      CARGO_REGISTRY_TOKEN:
        required: true

jobs:
  build:
    name: ${{ inputs.target }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix-shell -p nix-info --run "nix-info -m"
        if: ${{ inputs.nix-info }}
      # NOTE: the action's own installer evaluates nixpkgs-unstable, which
      # refuses x86_64-darwin since 26.11: cachix comes from the nixpkgs the
      # project's flake locks instead, the one its build uses.
      - name: Cachix from the project's nixpkgs
        run: nix build --inputs-from . 'nixpkgs#cachix^bin' --out-link "$RUNNER_TEMP/cachix"
      - uses: cachix/cachix-action@v16
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          cachixBin: ${{ runner.temp }}/cachix-bin/bin/cachix
      # NOTE: the publishing job runs first and every other job needs it, so
      # a tag naming another version stops the release before any build,
      # upload or publish. The package is the one `cargo publish` takes, the
      # root manifest's, whatever the `project` input names.
      - name: The tag names the crate version
        if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -eu
          metadata="$RUNNER_TEMP/cargo-metadata.json"
          nix develop --no-write-lock-file -c cargo metadata --no-deps --format-version 1 > "$metadata"
          version=$(jq -r --arg manifest "$PWD/Cargo.toml" '.packages[] | select(.manifest_path == $manifest) | .version' "$metadata")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the crate version (${version:-no package at the root})"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - run: nix build .#cross-${{ inputs.target }} --no-write-lock-file
      - run: cp result/bin/${{ inputs.project }}* .
      - run: chmod u+w ${{ inputs.project }}*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-${{ inputs.target }}
          path: ${{ inputs.project }}*
      - run: |
          cp -R result/share .
          chmod -R u+w share
        if: ${{ inputs.share }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.share }}
        with:
          name: share
          path: share
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.share && startsWith(github.ref, 'refs/tags/') }}
        with:
          name: share
          path: share
      - run: tar cvzf ${{ inputs.project }}.${{ inputs.target }}.tgz ${{ inputs.project }}* share
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - run: zip -r ${{ inputs.project }}.${{ inputs.target }}.zip ${{ inputs.project }}*.exe share
        if: ${{ startsWith(github.ref, 'refs/tags/') && endsWith(inputs.target, '-windows') }}
      - uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            ${{ inputs.project }}.${{ inputs.target }}.tgz
            ${{ inputs.project }}.${{ inputs.target }}.zip
      - if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/') }}
        run: |
          git clean -fd
          nix develop --ignore-env -k CARGO_REGISTRY_TOKEN -c cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
